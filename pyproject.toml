[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "emcee"
description = "The Python ensemble sampling toolkit for MCMC"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Daniel Foreman-Mackey", email = "foreman.mackey@gmail.com" },
]
maintainers = [
    { name = "Daniel Foreman-Mackey", email = "foreman.mackey@gmail.com" },
]
requires-python = ">=3.9"
dependencies = ["numpy>=1.17"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://emcee.readthedocs.io"
Source = "https://github.com/dfm/emcee"

[project.optional-dependencies]
extras = ["h5py", "scipy", "tqdm", "ipywidgets"]
tests = ["pytest", "pytest-cov", "coverage[toml]"]

[dependency-groups]
dev = ["ty", "pre-commit", "coverage[toml]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emcee = ["py.typed"]

[tool.setuptools_scm]
version_file = "src/emcee/emcee_version.py"
version_file_template = "__version__ = \"{version}\"\n"

[tool.uv]
# The version comes from setuptools_scm, so the cached build of the
# project must be invalidated when the git state changes, not only when
# pyproject.toml does.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.pytest.ini_options]
testpaths = ["src/emcee/tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ty.src]
include = ["src"]
# emcee 2.x compatibility shims kept only for backwards compatibility;
# they import optional packages that are not part of any extra.
exclude = [
    "src/emcee/interruptible_pool.py",
    "src/emcee/mpi_pool.py",
    "src/emcee/ptsampler.py",
]

[tool.ruff]
line-length = 79
target-version = "py39"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tutorial notebooks are formatted but not linted (parity with the old
# isort hook, which excluded them).
"docs/tutorials/*" = ["ALL"]
# Contains an unbreakable URL inside a docstring, where `# noqa` cannot
# be applied.
"src/emcee/autocorr.py" = ["E501"]

[tool.coverage.run]
parallel = true
branch = true
source = ["emcee"]
omit = [
    "*/emcee/interruptible_pool.py",
    "*/emcee/mpi_pool.py",
    "*/emcee/ptsampler.py",
    "*/emcee/tests/*",
    "*__init__*"
]

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "raise ImportError",
    "except ImportError",
    "def __len__",
    "def __repr__",
    "@deprecated",
    'deprecation_warning\(',
    "if tqdm is None",
    "if TYPE_CHECKING:",
    'class .*\bProtocol\):',
]
