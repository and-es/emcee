[tox]
envlist = py{39,310,311,312,313,314}{,-extras},lint

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311-extras
    3.12: py312
    3.13: py313-extras
    3.14: py314

[testenv]
deps = coverage[toml]
extras =
    tests
    extras: extras
commands =
    pip freeze
    python -m coverage run -m pytest -v {posargs}

[testenv:lint]
skip_install = true
deps = pre-commit
commands =
    pre-commit run --all-files
