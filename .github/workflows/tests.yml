name: Tests

on:
  push:
    branches:
      - main
    tags:
      - "*"
    paths-ignore:
      - "joss/**"
      - "docs/**"
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Jobs without the extras installed skip the h5py/scipy tests
        # (~82% coverage), so they get a looser gate than the extras
        # jobs.
        include:
          - python-version: "3.11"
            os: "ubuntu-latest"
            extras: false
            coverage-gate: 80
          - python-version: "3.14"
            os: "ubuntu-latest"
            extras: false
            coverage-gate: 80
          - python-version: "3.13"
            os: "macos-latest"
            extras: true
            coverage-gate: 95
          - python-version: "3.13"
            os: "windows-latest"
            extras: true
            coverage-gate: 95

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: >
          uv sync --extra tests
          ${{ matrix.extras && '--extra extras' || '' }}
      - name: Run tests
        run: uv run --no-sync coverage run -m pytest -v src/emcee/tests
      - name: Combine and upload coverage
        run: |
          uv run --no-sync coverage combine
          uv run --no-sync coverage report --fail-under=${{ matrix.coverage-gate }}
          uv run --no-sync coverage xml -i --fail-under=0
          uvx coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_PARALLEL: true
          COVERALLS_FLAG_NAME: ${{ matrix.python-version }}-${{ matrix.os }}

  lower-bound:
    # Check that the declared minimum numpy still works. The extras are
    # left unpinned; only numpy is forced down to the floor.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install dependencies with the minimum supported numpy
        run: |
          uv sync --extra tests --extra extras
          uv pip install "numpy==2.0.*"
      - name: Run tests
        run: uv run --no-sync pytest -v src/emcee/tests

  coverage:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          # This job only runs `uvx coveralls --finish` without a
          # checkout, so there is nothing to cache or hash.
          enable-cache: false
          ignore-empty-workdir: true
      - name: Finish coverage collection
        run: uvx coveralls --finish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          cache-suffix: ${{ github.job }}
      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Lint the code
        run: uvx pre-commit run --all-files --show-diff-on-failure

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: Install dependencies
        # Not --all-extras: type checking needs the runtime and test
        # dependencies but not the Sphinx toolchain from the docs extra
        run: uv sync --extra tests --extra extras
      - name: Type-check the code
        run: uv run --no-sync ty check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          cache-suffix: ${{ github.job }}
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*

  upload_pypi:
    needs: [tests, lower-bound, lint, types, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: artifact
          path: dist

      - uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          user: __token__
          password: ${{ secrets.pypi_password }}
